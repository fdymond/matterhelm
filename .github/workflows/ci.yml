name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge-verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - run: npm ci
      - run: npm run verify
      # ADR-006 §3: coverage only on ubuntu — one OS is enough for this signal
      # and keeps total CI wall-time down.
      - name: Coverage (pure-logic thresholds)
        if: matrix.os == 'ubuntu-latest'
        run: npm run coverage
      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: |
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const { total } = JSON.parse(require("fs").readFileSync("coverage/coverage-summary.json", "utf8"));
          const pct = (m) => `${total[m].pct.toFixed(2)}% (${total[m].covered}/${total[m].total})`;
          console.log("## Bridge coverage");
          console.log("");
          console.log("| Metric | Coverage |");
          console.log("| --- | --- |");
          console.log(`| Statements | ${pct("statements")} |`);
          console.log(`| Branches | ${pct("branches")} |`);
          console.log(`| Functions | ${pct("functions")} |`);
          console.log(`| Lines | ${pct("lines")} |`);
          console.log("");
          console.log(
            "Per-file 90% line threshold enforced for `src/mapping/**`, " +
            "`src/ipc/protocol.ts`, `src/config.ts` (ADR-006 §3, pure-logic " +
            "modules); `npm run coverage` fails the job if unmet."
          );
          NODE

  app-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet build app/MatterHelm/MatterHelm.csproj -c Release
      - run: dotnet test app/MatterHelm.Tests/MatterHelm.Tests.csproj -c Release --collect:"XPlat Code Coverage" --logger "trx;LogFileName=app-tests.trx" --results-directory app/MatterHelm.Tests/TestResults
      - name: Upload app test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-test-results
          path: app/MatterHelm.Tests/TestResults/**/*.trx
          retention-days: 14
      - name: Coverage report (ReportGenerator)
        uses: danielpalme/ReportGenerator-GitHub-Action@5f3701a41d14548c9b8e575a5c235230e515cbc0 # 5.6.0
        with:
          reports: app/MatterHelm.Tests/TestResults/**/coverage.cobertura.xml
          targetdir: coveragereport
          reporttypes: MarkdownSummaryGithub
      - name: Append coverage summary
        shell: pwsh
        run: Get-Content coveragereport/SummaryGithub.md | Add-Content -Path $env:GITHUB_STEP_SUMMARY
      # ADR-006 §3: app is UI/interop-heavy (WinForms tray UI, Win32 P/Invoke
      # actions) — those paths are exercised manually/E2E, not unit tests; the
      # pure-logic bar lives in code review, not this gate. Threshold is set
      # a few points below the measured local baseline (~58% line coverage
      # with the current test suite) to catch regressions without being
      # brittle to incidental line-count drift; raise as UI/interop code
      # gains test seams.
      - name: Enforce coverage threshold
        shell: pwsh
        run: |
          $cobertura = Get-ChildItem -Path app/MatterHelm.Tests/TestResults -Filter coverage.cobertura.xml -Recurse |
            Select-Object -First 1 -ExpandProperty FullName
          [xml]$xml = Get-Content $cobertura
          $lineRate = [double]$xml.coverage.'line-rate'
          $pct = [math]::Round($lineRate * 100, 2)
          $threshold = 45
          "Line coverage: $pct% (threshold: $threshold%)" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          Write-Host "Line coverage: $pct% (threshold: $threshold%)"
          if ($pct -lt $threshold) {
            Write-Error "App line coverage $pct% is below the $threshold% threshold (ADR-006 §3)."
            exit 1
          }

  package:
    name: Package
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Install Inno Setup 7.1.1
        shell: pwsh
        env:
          INNO_SETUP_DIR: ${{ runner.temp }}\inno-setup-7.1.1
        run: |
          $installerPath = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
          $expectedHash = '8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0'
          if ($expectedHash -notmatch '^[0-9a-fA-F]{64}$') {
            throw 'Replace the Inno Setup 7.1.1 SHA-256 placeholder with the official 64-hex digest.'
          }
          Invoke-WebRequest `
            -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' `
            -OutFile $installerPath
          $actualHash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) {
            throw "Inno Setup 7.1.1 SHA-256 mismatch: expected $expectedHash, got $actualHash."
          }
          $install = Start-Process -FilePath $installerPath -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/SP-',
            "/DIR=$env:INNO_SETUP_DIR"
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Inno Setup 7.1.1 installation failed with exit code $($install.ExitCode)."
          }
          $compilerPath = Join-Path $env:INNO_SETUP_DIR 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $compilerPath -PathType Leaf)) {
            throw "Inno Setup compiler not found at '$compilerPath'."
          }
      - name: Build distribution
        # Accepted trade-off: depends on nodejs.org availability and trusts SHASUMS256.txt over HTTPS; the .asc signature is not checked.
        run: ./build.ps1 -SkipTests -VerifyNodeChecksum
      - name: Compile installer and assert package metadata
        shell: pwsh
        env:
          INNO_SETUP_DIR: ${{ runner.temp }}\inno-setup-7.1.1
        run: |
          & (Join-Path $env:INNO_SETUP_DIR 'ISCC.exe') /DAppVersion=0.0.0 /Q installer\matterhelm.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          foreach ($path in @('dist/THIRD-PARTY-NOTICES.txt', 'dist/sidecar-layout.json')) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Packaging did not produce required artifact '$path'."
            }
          }
