name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bridge-verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - run: npm ci
      - run: npm run verify

  app-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build app/HtpcMatterBridge/HtpcMatterBridge.csproj -c Release
      - run: dotnet test app/HtpcMatterBridge.Tests/HtpcMatterBridge.Tests.csproj -c Release
