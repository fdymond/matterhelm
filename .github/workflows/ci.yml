name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge-verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - run: npm ci
      - run: npm run verify
      # ADR-006 §3: coverage only on ubuntu — one OS is enough for this signal
      # and keeps total CI wall-time down.
      - name: Coverage (pure-logic thresholds)
        if: matrix.os == 'ubuntu-latest'
        run: npm run coverage
      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: |
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const { total } = JSON.parse(require("fs").readFileSync("coverage/coverage-summary.json", "utf8"));
          const pct = (m) => `${total[m].pct.toFixed(2)}% (${total[m].covered}/${total[m].total})`;
          console.log("## Bridge coverage");
          console.log("");
          console.log("| Metric | Coverage |");
          console.log("| --- | --- |");
          console.log(`| Statements | ${pct("statements")} |`);
          console.log(`| Branches | ${pct("branches")} |`);
          console.log(`| Functions | ${pct("functions")} |`);
          console.log(`| Lines | ${pct("lines")} |`);
          console.log("");
          console.log(
            "Per-file 90% line threshold enforced for `src/mapping/**`, " +
            "`src/ipc/protocol.ts`, `src/config.ts` (ADR-006 §3, pure-logic " +
            "modules); `npm run coverage` fails the job if unmet."
          );
          NODE

  app-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet build app/MatterHelm/MatterHelm.csproj -c Release
      - run: dotnet test app/MatterHelm.Tests/MatterHelm.Tests.csproj -c Release --collect:"XPlat Code Coverage"
      - name: Coverage report (ReportGenerator)
        uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # 5.5.11
        with:
          reports: app/MatterHelm.Tests/TestResults/**/coverage.cobertura.xml
          targetdir: coveragereport
          reporttypes: MarkdownSummaryGithub
      - name: Append coverage summary
        shell: pwsh
        run: Get-Content coveragereport/SummaryGithub.md | Add-Content -Path $env:GITHUB_STEP_SUMMARY
      # ADR-006 §3: app is UI/interop-heavy (WinForms tray UI, Win32 P/Invoke
      # actions) — those paths are exercised manually/E2E, not unit tests; the
      # pure-logic bar lives in code review, not this gate. Threshold is set
      # a few points below the measured local baseline (~58% line coverage
      # with the current test suite) to catch regressions without being
      # brittle to incidental line-count drift; raise as UI/interop code
      # gains test seams.
      - name: Enforce coverage threshold
        shell: pwsh
        run: |
          $cobertura = Get-ChildItem -Path app/MatterHelm.Tests/TestResults -Filter coverage.cobertura.xml -Recurse |
            Select-Object -First 1 -ExpandProperty FullName
          [xml]$xml = Get-Content $cobertura
          $lineRate = [double]$xml.coverage.'line-rate'
          $pct = [math]::Round($lineRate * 100, 2)
          $threshold = 45
          "Line coverage: $pct% (threshold: $threshold%)" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          Write-Host "Line coverage: $pct% (threshold: $threshold%)"
          if ($pct -lt $threshold) {
            Write-Error "App line coverage $pct% is below the $threshold% threshold (ADR-006 §3)."
            exit 1
          }

  package:
    name: Package
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build distribution
        run: ./build.ps1 -SkipTests
      - name: Compile installer and assert package metadata
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=0.0.0 /Q installer\matterhelm.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          foreach ($path in @('dist/THIRD-PARTY-NOTICES.txt', 'dist/sidecar-layout.json')) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Packaging did not produce required artifact '$path'."
            }
          }
