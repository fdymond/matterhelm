name: release

# Tag-triggered release. Push a `v*` tag (e.g. `v0.1.0`) to run the full
# verify/build/test gate and publish a GitHub Release with auto-generated
# notes. Mirrors ci.yml's setup steps (node 22, dotnet 10.0.x) so this job
# exercises exactly what CI already proved green on main.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package-lock.json

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install bridge deps
        working-directory: bridge
        run: npm ci

      - name: Bridge verify (lint + typecheck + tests)
        working-directory: bridge
        run: npm run verify

      - name: App build (Release, warnings-as-errors)
        run: dotnet build app/MatterHelm/MatterHelm.csproj -c Release

      - name: App tests
        run: dotnet test app/MatterHelm.Tests/MatterHelm.Tests.csproj -c Release

      # S3-1: build.ps1 produces the single self-contained dist/ folder
      # (Node SEA sidecar exe + dotnet-publish single-file tray exe; no dev
      # tools required on the target machine). -SkipTests skips only the
      # bridge `npm run verify` INSIDE the script — the explicit verify and
      # app-test gate steps above already ran on this exact commit, so
      # re-running the suites here would prove nothing twice as slowly.
      - name: Build dist
        run: ./build.ps1 -SkipTests

      - name: Zip dist (portable)
        run: Compress-Archive -Path dist/* -DestinationPath matterhelm-${{ github.ref_name }}-win-x64.zip

      # S10: Windows installer (Inno Setup 6 is preinstalled on
      # windows-latest runners). Version = the tag without its leading "v".
      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q /DAppVersion=$version installer\matterhelm.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          Get-ChildItem dist-installer

      # S10: SHA-256 manifest over both assets so downloads are verifiable
      # (README documents `certutil -hashfile <file> SHA256`).
      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $lines = foreach ($f in @(
              "matterhelm-${{ github.ref_name }}-win-x64.zip",
              (Get-ChildItem dist-installer/MatterHelm-Setup-*.exe).FullName)) {
            $h = Get-FileHash $f -Algorithm SHA256
            "{0}  {1}" -f $h.Hash.ToLowerInvariant(), (Split-Path $f -Leaf)
          }
          Set-Content SHA256SUMS.txt $lines -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          generate_release_notes: true
          files: |
            matterhelm-${{ github.ref_name }}-win-x64.zip
            dist-installer/MatterHelm-Setup-*.exe
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
