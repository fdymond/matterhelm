name: release

# Tag-triggered release. Push a `v*` tag (e.g. `v0.7.1`) to run the full
# verify/build/test gate and publish a GitHub Release with auto-generated
# notes. Mirrors ci.yml's pinned Node and .NET setup so this job
# exercises exactly what CI already proved green on main.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a tag release between provenance attestation and publication.
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert release tag matches package versions
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $tagVersion = $env:TAG -replace '^v', ''
          [xml]$project = Get-Content app/MatterHelm/MatterHelm.csproj -Raw
          $appVersion = $project.SelectSingleNode('//Version').InnerText
          $bridgeVersion = (Get-Content bridge/package.json -Raw | ConvertFrom-Json).version
          if ($tagVersion -ne $appVersion) {
            throw "Release tag version '$tagVersion' does not match app/MatterHelm/MatterHelm.csproj Version '$appVersion'."
          }
          if ($tagVersion -ne $bridgeVersion) {
            throw "Release tag version '$tagVersion' does not match bridge/package.json version '$bridgeVersion'."
          }
          Write-Host "Release version verified: $tagVersion"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: bridge/package-lock.json

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Bridge dependencies
        working-directory: bridge
        run: npm ci

      - name: Bridge verify
        working-directory: bridge
        run: npm run verify

      - name: App build (Release, warnings-as-errors)
        run: dotnet build app/MatterHelm/MatterHelm.csproj -c Release

      - name: App tests
        run: dotnet test app/MatterHelm.Tests/MatterHelm.Tests.csproj -c Release

      # Bridge and app tests are explicit gates above, so build.ps1 skips its
      # duplicate bridge verification and produces the self-contained dist/ (Node
      # SEA sidecar exe + dotnet-publish single-file tray exe; no dev tools
      # required on the target machine).
      - name: Build dist
        run: ./build.ps1 -SkipTests -VerifyNodeChecksum

      - name: Zip dist (portable)
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: Compress-Archive -Path dist/* -DestinationPath "matterhelm-$($env:TAG)-win-x64.zip"

      # S10: Windows installer. Version = the tag without its leading "v".
      - name: Build installer
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          INNO_SETUP_DIR: ${{ runner.temp }}\inno-setup-7.1.1
        run: |
          $installerPath = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
          $expectedHash = '8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0'
          if ($expectedHash -notmatch '^[0-9a-fA-F]{64}$') {
            throw 'Replace the Inno Setup 7.1.1 SHA-256 placeholder with the official 64-hex digest.'
          }
          Invoke-WebRequest `
            -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' `
            -OutFile $installerPath
          $actualHash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) {
            throw "Inno Setup 7.1.1 SHA-256 mismatch: expected $expectedHash, got $actualHash."
          }
          $install = Start-Process -FilePath $installerPath -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/SP-',
            "/DIR=$env:INNO_SETUP_DIR"
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Inno Setup 7.1.1 installation failed with exit code $($install.ExitCode)."
          }
          $compilerPath = Join-Path $env:INNO_SETUP_DIR 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $compilerPath -PathType Leaf)) {
            throw "Inno Setup compiler not found at '$compilerPath'."
          }
          $version = $env:TAG.TrimStart("v")
          & $compilerPath /Q /DAppVersion=$version installer\matterhelm.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          Get-ChildItem dist-installer

      # S10: SHA-256 manifest over both assets so downloads are verifiable
      # (README documents `certutil -hashfile <file> SHA256`).
      - name: Generate SHA256SUMS
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $lines = foreach ($f in @(
              "matterhelm-$($env:TAG)-win-x64.zip",
              (Get-ChildItem dist-installer/MatterHelm-Setup-*.exe).FullName)) {
            $h = Get-FileHash $f -Algorithm SHA256
            "{0}  {1}" -f $h.Hash.ToLowerInvariant(), (Split-Path $f -Leaf)
          }
          $manifest = ($lines -join "`n") + "`n"
          [IO.File]::WriteAllText(
            (Join-Path $PWD "SHA256SUMS.txt"),
            $manifest,
            [Text.Encoding]::ASCII)
          Get-Content SHA256SUMS.txt

      - name: Attest release build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            matterhelm-${{ github.ref_name }}-win-x64.zip
            dist-installer/MatterHelm-Setup-*.exe
            SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          generate_release_notes: true
          files: |
            matterhelm-${{ github.ref_name }}-win-x64.zip
            dist-installer/MatterHelm-Setup-*.exe
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify draft release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart("v")
          $expected = @(
            "MatterHelm-Setup-$version.exe",
            "matterhelm-$($env:TAG)-win-x64.zip",
            "SHA256SUMS.txt"
          )
          $release = gh release view $env:TAG --json isDraft,assets | ConvertFrom-Json
          if (-not $release.isDraft) {
            throw "Release $env:TAG must remain a draft until all assets are verified."
          }
          $actual = @($release.assets | ForEach-Object { $_.name })
          $missing = @($expected | Where-Object { $_ -notin $actual })
          $unexpected = @($actual | Where-Object { $_ -notin $expected })
          if ($missing.Count -ne 0) {
            throw "Draft release is missing required assets: $($missing -join ', ')"
          }
          if ($unexpected.Count -ne 0) {
            throw "Draft release has unexpected assets: $($unexpected -join ', ')"
          }
          $empty = @($release.assets | Where-Object { $_.size -le 0 } | ForEach-Object { $_.name })
          if ($empty.Count -ne 0) {
            throw "Draft release has empty assets: $($empty -join ', ')"
          }
          $notUploaded = @($release.assets | Where-Object { $_.state -ne 'uploaded' } | ForEach-Object { $_.name })
          if ($notUploaded.Count -ne 0) {
            throw "Draft release has assets not in the uploaded state: $($notUploaded -join ', ')"
          }
          Write-Host "Draft release assets verified: $($expected -join ', ')"

      - name: Publish verified GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit $env:TAG --draft=false
